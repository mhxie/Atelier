# Portable agent registry.
#
# `agents/*.md` is canonical. The edge renderer copies each source to Claude
# and generates the project-scoped Codex adapter from this registry.
#
# Each agent declares a `voices` keyed inline table mapping leg name to
# model identity. Allowed leg keys:
#
#   native  The selected interactive runtime's project-agent leg. Claude Code
#           dispatches `.claude/agents/<name>.md`; Codex dispatches
#           `.codex/agents/<name>.toml`. The runtime adapter controls the
#           concrete model and reasoning effort.
#   direct  OpenAI-compatible direct-api leg, dispatched via
#           `uv run scripts/chat_completion.py --model <identity>`.
#   codex   Explicit external Codex CLI reviewer leg, dispatched via
#           `codex exec -m <identity>` independently of the selected runtime.
#
# Bindings are available voices, not permission grants or mandatory fanout.
# The selected procedure chooses calls using `protocols/agent-handoff.md`;
# `protocols/agent-handoff.md` owns dispatch inputs and completion reporting.
#
# Model identities are defined in `harness/models.toml`; provider bindings
# live in gitignored `profile/models.toml`.
#
# Each voice identity carries a runtime-neutral `reasoning_tier` in
# `harness/models.toml`. Codex inherits the user's selected model and maps the
# native voice's tier to `model_reasoning_effort`. Lint enforces
# registry-to-adapter parity.

[agents.precedent-judge]
source = "agents/precedent-judge.md"
voices = { native = "sonnet" }
status = "canonical"
description = "Applies the user's own past decisions to a new pending item; one JSON verdict per prompt file, never invents policy. Le cercle archetype: The Clerk of the Court."

[agents.challenger]
source = "agents/challenger.md"
voices = { native = "opus", direct = "deepseek_pro_max" }
status = "canonical"
description = "Probes the painter's thoughts with sharp questions; affirms or counters in turn. Le cercle archetype: The Critic (Degas)."

[agents.curator]
source = "agents/curator.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Drafts note-content operations (compactions, merges, new notes, wiki entries) for the orchestrator to write under $OV/. Le cercle archetype: The Collector (Caillebotte)."

[agents.forgetter]
source = "agents/forgetter.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Active decay scanner over $OV/: redundant / time-stale / contradicted / low-signal. Proposes; never deletes. Returns findings inline via envelope for the trusted parent to validate. Le cercle archetype: The Conservator."

[agents.librarian]
source = "agents/librarian.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Recommends readings, resources, and thinkers relevant to the painter's interests and goals. Le cercle archetype: The Cataloguer."

[agents.meeting]
source = "agents/meeting.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Processes work meeting transcripts into structured notes with action items and decisions. Le cercle archetype: The Stenographer."

[agents.reader]
source = "agents/reader.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Reads articles and notes through critical, structural, practical, and dialectical lenses. For dense theory, foundational papers, or hard texts, dispatch the Scholar instead. Le cercle archetype: The Reader."

[agents.scholar]
source = "agents/scholar.md"
voices = { native = "opus", direct = "deepseek_pro_max" }
status = "canonical"
description = "Deep-cognition variant of Reader: same lenses, same workflow, dispatched with stronger voices for dense theory, foundational papers, and hard texts. Le cercle archetype: The Scholar."

[agents.researcher]
source = "agents/researcher.md"
voices = { native = "opus", direct = "deepseek_pro_max" }
status = "canonical"
description = "Gathers raw context from the painter's œuvre ($OV/). Le cercle archetype: The Observer (Pissarro)."

[agents.reviewer]
source = "agents/reviewer.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Quality-checks session outputs and system evolution changes. Le cercle archetype: The Arbiter (Manet)."

[agents.scout]
source = "agents/scout.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Gathers external context from outside the œuvre: articles, discussions, research, recent developments. Le cercle archetype: The Flâneur."

[agents.synthesizer]
source = "agents/synthesizer.md"
voices = { native = "opus", direct = "deepseek_pro_max" }
status = "canonical"
description = "Composes gathered context into structured reflections, summaries, and insights. Le cercle archetype: The Colorist (Monet)."

[agents.thinker]
source = "agents/thinker.md"
voices = { native = "opus", direct = "deepseek_pro_max" }
status = "canonical"
description = "Applies structured thinking frameworks for outside-view reasoning. Le cercle archetype: The Structuralist (Cézanne)."

[agents.privacy-reviewer]
source = "agents/privacy-reviewer.md"
voices = { native = "sonnet", direct = "deepseek_pro" }
status = "canonical"
description = "Semantic privacy scanner for committed-file diffs. Catches leaks the mechanical scripts/privacy_check.py misses. Le cercle archetype: The Steward."

[agents.scribe]
source = "agents/scribe.md"
voices = { native = "haiku" }  # single-leg by design: it writes files; a second leg risks duplicate writes or leaks
status = "canonical"
description = "Records user-dictated raw content to the named target file verbatim. Le cercle archetype: The Typewriter."
