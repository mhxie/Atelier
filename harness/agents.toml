# Portable agent registry.
#
# Claude Code uses `.claude/agents/*.md` as native subagent specs.
# Codex uses project-scoped `.codex/agents/*.toml` adapters. Each adapter
# exposes this registry's description and routes the native subagent back to
# the same `.claude/agents/*.md` role brief. `scripts/harness_lint.py` enforces
# the mapping so the adapter edge cannot become a second role source.
#
# Each agent declares a `voices` keyed inline table mapping leg name to
# model identity. Allowed leg keys:
#
#   native  The selected interactive runtime's project-agent leg. Claude Code
#           dispatches `.claude/agents/<name>.md`; Codex dispatches
#           `.codex/agents/<name>.toml`. The runtime adapter controls the
#           concrete model and reasoning effort.
#   direct  OpenAI-compatible direct-api leg, dispatched via
#           `uv run scripts/chat_completion.py --model <identity>`.
#   codex   Explicit external Codex CLI reviewer leg, dispatched via
#           `codex exec -m <identity>` independently of the selected runtime.
#
# Bindings are available voices, not permission grants or mandatory fanout.
# The selected procedure chooses calls using `protocols/agent-handoff.md`;
# `protocols/agent-handoff.md` owns dispatch inputs and completion reporting.
#
# Model identities are defined in `harness/models.toml`; provider bindings
# live in gitignored `profile/models.toml`.
#
# Each voice identity carries a runtime-neutral `reasoning_tier` in
# `harness/models.toml`. Codex inherits the user's selected model and maps the
# native voice's tier to `model_reasoning_effort`. Lint enforces
# registry-to-adapter parity.

[agents.precedent-judge]
source = ".claude/agents/precedent-judge.md"
voices = { native = "sonnet" }
status = "portable-adapted"
description = "Applies the user's own past decisions to a new pending item; one JSON verdict per prompt file, never invents policy. Le cercle archetype: The Clerk of the Court."
codex_prompt = "Run the Precedent Judge role through native Codex agent `precedent-judge`; `.claude/agents/precedent-judge.md` remains authoritative."

