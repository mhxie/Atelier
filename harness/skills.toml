# Reflection workflows default to fresh sessions (a reused session pollutes
# the new reflection); resume_friendly marks the continuation-safe exceptions.
resume_friendly = true

[skills.lint]
# Public field validation is owned by harness/registry.schema.json;
# scripts/harness_lint.py retains cross-file and workflow checks.
source = "skills/lint/SKILL.md"
