# Public skill registry.
#
# `skills/<name>/SKILL.md` is canonical. The edge renderer copies each source
# to Claude slash-command and Codex repo-skill discovery.
#
# An alias keeps a short canonical skill and names its target with `alias_of`.
#
# Most skills are reachable through `harness/intents.toml`. Skills that are intentionally direct-only
# (no /hi routing) declare `direct_only = true`. These are typically:
#   - dashboards (read-only, on-demand)
#   - destructive / audit operations (need explicit user trigger)
# `scripts/harness_lint.py` checks that every entry here either has an
# intents.toml row OR declares `direct_only = true`.
# Every row is user-facing. Routine adapters have their own registry.

[skills.hi]
source = "skills/hi/SKILL.md"
category = "session"
status = "canonical"
description = "Universal entry point — intent router for reflection, planning, action, reading, learning, capture, and more."

[skills.reflect]
source = "skills/reflect/SKILL.md"
category = "session"
status = "alias"
alias_of = "hi"
description = "Alias of /hi."

[skills.daily-reflection]
source = "skills/daily-reflection/SKILL.md"
category = "session"
status = "canonical"
description = "Daily reflection with on-demand energy and open-exploration branches, grounded in notes and goals."

[skills.read]
source = "skills/read/SKILL.md"
category = "session"
status = "canonical"
description = "Read and discuss a source with one reading worker; expand perspectives, evidence gathering, or review when the task needs it."

