# Portable path registry.
#
# Canonical logical-name → physical-path mapping for every L1–L4 surface in
# the user's vault. Committed. Generic shape that every OSS user inherits.
#
# Renames happen here. A tier rename (e.g., `drafts` → `wip`) used to touch
# every doc that mentioned the path; now it's one edit in this file. The
# `harness_lint.py path-literal` check enforces no committed `.md` hardcodes
# an `$OV/<segment>/` literal whose `<segment>` is not in this registry.
#
# Per-user extensions (localized wikis, sandbox overrides, additional tiers
# private to one user's vault) belong in `harness/paths.local.toml`
# (gitignored). The runtime merges canonical + local at session start.
#
# Resolution rule: every value resolves under `$OV` unless it starts with
# `/` (absolute path). The leading `$OV/` is implicit; do not repeat it.
# So `wip = "wip"` resolves to `$OV/wip/`. Use `$OV/` prefix only when you
# explicitly need to denote vault-root anchoring in prose; the registry
# itself stores bare segment paths.

[paths]
# L4 — locally certified (wiki). Primary surface is always `wiki`; localized
# variants live under `[paths.wiki_localized]` per user.
wiki            = "wiki"

# L3 — externally certified
papers          = "papers"
preprints       = "preprints"

# L2 — working / half-baked. The persistent surfaces.
daily_notes     = "daily"
reflections     = "reflections"
research        = "research"
agent_findings  = "agent-findings"
wip             = "wip"
gtd             = "gtd"
travel          = "travel"
health          = "health"
work            = "work"
career          = "career"
people          = "people"
talent          = "career/talent"
finance         = "finance"
personal        = "personal"
housing         = "personal/housing"
auto            = "personal/auto"
abroad          = "personal/abroad"
secure          = "personal/secure"
dev             = "personal/dev"
projects        = "personal/projects"
archive         = "archive"
sessions        = "sessions"
# Reflect-created notes awaiting /triage filing.
notes           = "notes"
# Note: `profile/` is repo-side gitignored config, NOT a vault tier. Do not register here.

# Operational state (bot claims, queues, watch registries, miss logs) and
# archived private routine prompts. Underscore prefix keeps them sorted apart
# from knowledge tiers; they are state, not notes.
meta            = "_meta"
routine_prompts = "_routine_prompts"

# L1: pending or raw capture
inbox           = "inbox"
# Generated digest notes in YYYY-MM/ buckets; routine collection never reads them.
digest          = "inbox/digest"
cache           = "cache"
# Reflect's audio recordings; their transcripts land in notes/.
audio_memos     = "audio-memos"

# Private operational extensions. These surfaces are excluded from semantic
# retrieval because `_tools` is an operational directory at any depth.
private_skills   = "_tools/skills"
private_agents   = "_tools/agents"
private_routines = "_tools/routines"
private_tools    = "_tools/tools"

[paths.wiki_localized]
# Empty by default. OSS users add their second-language wiki here, e.g.:
#   zh = "wiki-cn"
#   ja = "wiki-ja"
# Per-user values go in `harness/paths.local.toml` so the canonical file
# stays generic. Scripts call `wiki_dirs()` which returns the primary
# `wiki` directory plus every entry in this table.

# Classification uses logical names above; localized wikis inherit L4 as shadows.
# Labels describe a knowledge layer, never a claim's current review status.
[knowledge_levels]
1 = { label = "Capture", paths = ["inbox", "digest", "cache", "audio_memos"], segments = ["raw"] }
2 = { label = "Working", paths = ["daily_notes", "reflections", "research", "agent_findings", "wip", "gtd", "travel", "health", "work", "career", "people", "talent", "finance", "personal", "housing", "auto", "abroad", "secure", "dev", "projects", "archive", "sessions", "notes"] }
3 = { label = "Sources", paths = ["papers", "preprints"] }
4 = { label = "Wiki", paths = ["wiki"] }
