# Portable command registry.
#
# Claude Code uses `.claude/commands/*.md` as native slash-command specs.
# Codex exposes the same workflows as explicit repo skills under
# `.agents/skills/<command>/`, invoked as `$<command>`.
#
# Alias convention: when a command is renamed, the new name owns the primary
# entry (full source / description / codex_prompt). The old name keeps a
# minimal block with `alias_of = "<new-name>"` and `status = "alias"`. The
# alias's `source` points to a short shim file under `.claude/commands/`, and
# the matching Codex skill reads that shim before running the target.
#
# Routing surface: most commands are reachable via `/hi <natural-language>`
# through `harness/intents.toml`. Commands that are intentionally direct-only
# (no /hi routing) declare `direct_only = true`. These are typically:
#   - dashboards (read-only, on-demand)
#   - destructive / audit operations (need explicit user trigger)
# `scripts/harness_lint.py` checks that every entry here either has an
# intents.toml row OR declares `direct_only = true`.
# User-facing rows also require a matching Codex `$command` skill. Bot-only
# rows declare `user_facing = false`.

[commands.hi]
source = ".claude/commands/hi.md"
