# Model identity registry: committed schema, no bindings. Each `[models.X]` holds
# only a runtime-neutral `reasoning_tier`; provider bindings live in the
# gitignored `profile/models.toml` and merge at runtime.
#
# Roles live in `agents/*.md`; each role's `voices` table in `harness/agents.toml`
# maps its legs (`native`/`direct`/`codex`/`agy`) to these identities, and
# `protocols/agent-handoff.md` owns dispatch. Claude binds `native` models in agent
# frontmatter; Codex maps `reasoning_tier` to effort.
#
# Binding keys (profile/models.toml only): `claude_code`, `codex`,
# `codex_reasoning_effort` (low|medium|high|xhigh; direct legs), `agy`
# (scripts/agy_leg.py; effort rides the id), `direct_api`, `direct_api_base`,
# `direct_api_extras` (request-body table), `direct_api_timeout` (seconds),
# `direct_api_provider` (only "openai"), `api_env` (env var holding the key).
# A leg with no usable binding or key exits 2; callers soft-skip it.

[models.opus]
# Anthropic Opus — high-cognition Anthropic leg used by deep-thinking roles.
reasoning_tier = "deep"

[models.sonnet]
# Anthropic Sonnet execution and retrieval leg.
reasoning_tier = "xdeep"

[models.haiku]
# Anthropic Haiku — cheap Anthropic leg used by mechanical-capture roles.
reasoning_tier = "light"

[models.deepseek_pro_max]
# DeepSeek v4 Pro with thinking high + extended timeout.
reasoning_tier = "deep"

[models.deepseek_pro]
# DeepSeek v4 Pro with default thinking; the leg paired with Sonnet.
reasoning_tier = "balanced"

[models.deepseek_flash]
# DeepSeek v4 Flash. Reserved: no committed role binds it.
reasoning_tier = "light"

[models.codex_gpt55_max]
# Codex gpt-5.5 with reasoning_effort = "high".
reasoning_tier = "deep"

[models.gemini_flash]
# Antigravity fast leg paired with Sonnet on cross-validation roles.
reasoning_tier = "balanced"
binding_optional = true

[models.gemini_deep]
# Antigravity deep leg paired with Opus on deep-cognition roles.
reasoning_tier = "deep"
binding_optional = true
