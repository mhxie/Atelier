# Sync digests the mobile-capture submodule $OV/zettelm/ into the persistent
# L2 destinations (daily-notes/<date>.md for narrative; <domain>/raw/ for
# attachments), enriches with backlinks, appends a 3-prompt footer to the
# most recent daily note, then stages zettelm deletions for the user to
# commit. Procedure: .claude/commands/sync.md.
#
# Priority 28: between explore (22) and forget (25) on one side and meeting
# (30) on the other, so explicit "sync" / "digest zettelm" beats the
# general fallback but does not steal from meeting / reading / capture.
[intents.sync]
patterns = [
    "sync",
    "digest zettelm",
    "digest mobile",
    "process zettelm",
    "sync mobile notes",
    "fleeting digest",
]
mode = "sync"
procedure = ".claude/commands/sync.md"
context_budget_bytes = 4096
agents = ["researcher", "curator", "challenger", "scribe", "reviewer"]
profile_reads = []
priority = 28
pattern = "orchestrator-subagent"
expected_subagent_count = 5
parallel = false

# Forget routes to a Forgetter decay sweep over a bounded scope. Default
# scope is $OV/wip/ unless the user names a different path. Forgetter
# proposes; never deletes. See .claude/agents/forgetter.md.
[intents.forget]
patterns = [
    "forget",
    "decay",
    "scan for decay",
    "what should I forget",
    "clean up notes",
    "prune",
    "scan my wip",
    "scan my drafts",  # legacy alias; pre-rename muscle memory
]
mode = "decay-scan"
procedure = "protocols/intent-forget.md"
context_budget_bytes = 4096
agents = ["forgetter"]
profile_reads = []
priority = 25
pattern = "generator-verifier"
expected_subagent_count = 1
parallel = false

