# Intent catalog for `/hi <context>` (Claude Code) and `$hi <context>` (Codex).
#
# The orchestrator classifies the request against every row's `description`
# and executes exactly one `procedure`. Classification is model judgment: no
# field here is substring-matched and no row outranks another. Write each
# description so it is precise and disjoint from its siblings; that text is
# the whole routing contract.
#
# The gitignored overlay `harness/intents.local.toml` may extend `examples`
# for existing rows and may add private rows (`description` + `procedure`
# pointing at an existing local file, typically a private feature's
# SKILL.md) that this public catalog must never carry. It cannot change any
# other field of a canonical row.
#
# Schema:
#   description               one line: which requests this row serves. The
#                             classifier reads only this field.
#   examples                  optional short phrases in any language that
#                             illustrate the row; informational, never matched
#   mode                      string identifier of the /hi sub-mode
#   procedure                 authoritative project-relative workflow file;
#                             the router reads only this file after selection
#   context_budget_bytes      whole-output ceiling for scripts/context_bundle.py;
#                             32768 when profile files are preloaded (they land
#                             whole), 8192 for continuity-only rows
#   agents                    agent keys from harness/agents.toml the
#                             procedure typically dispatches (informational)
#   profile_reads             filenames under profile/ to pre-read before
#                             dispatch; empty means no context bundle
#   pattern                   coordination pattern annotation; the closed
#                             value set and the no-branching rule are defined
#                             once in harness/agents.toml
#   expected_subagent_count   typical dispatch count hint for review tooling
#   parallel                  whether the initial agents dispatch in one batch
#
# Keep the schema minimal and stable. Resist fields that encode current-model
# assumptions. Route logging and coverage review: protocols/intent-coverage.md.

# Capture matches on shape as well as phrase: a date-prefixed factual narrative
# with no analytical question is capture even when nothing below appears.
# Entry-hint skill: `.claude/skills/capture/SKILL.md` (forwards into `/hi`).
[intents.capture]
description = "Record what the user dictates, verbatim: an explicit 记一下 / log this / save this, or a date-prefixed factual narrative of events with no analytical question."
examples = [
    "记一下",
    "记录",
    "log this",
    "just write down",
    "save this",
    "5/4 早上去了 X, 中午吃了 Y",
]
mode = "capture-fast-path"
procedure = "protocols/intent-capture.md"
context_budget_bytes = 8192
agents = ["scribe"]
profile_reads = []
pattern = "solo"
expected_subagent_count = 1
parallel = false

# Reading routes to `.claude/commands/read.md`. Initial dispatch is Reader +
# Researcher; Reviewer + Challenger fire later as a write-back gate. A URL or
# wikilink that is merely part of a larger request (a day's events, an inbox
# triage, a question with a citation) is not reading.
# Entry-hint skill: `.claude/skills/reading/SKILL.md` (forwards into `/hi`).
[intents.reading]
description = "Read and discuss a written article, paper, or note the user supplies as the main payload: a URL, a [[wikilink]], pasted text, or 'read this' / 'discuss this'."
examples = [
    "read this https://example.com/post",
    "let's read [[Some Note]]",
    "discuss this article",
    "read with me",
]
mode = "read-and-discuss"
procedure = ".claude/commands/read.md"
context_budget_bytes = 32768
agents = ["reader", "researcher"]
profile_reads = ["identity.md"]
pattern = "agent-team"
expected_subagent_count = 2
parallel = true

