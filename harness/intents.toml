# Curate Readwise inbox against active goals. Procedure:
# .claude/commands/curate.md. Dispatches a general-purpose ad-hoc agent
# (not a named cercle role), so `agents = []`; pattern is solo.
#
# Priority 23: above explore (22) so Readwise-specific patterns ("recent
# saves", "my saves") win over explore's generic "what's interesting" when
# both could substring-match. All curate patterns are inbox/readwise-scoped,
# so false positives against explore are structurally unlikely.
