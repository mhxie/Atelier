# Forget routes to a Forgetter decay sweep over a bounded scope. Default scope
# is $OV/wip/ unless the user names a path. Forgetter proposes; never deletes.
[intents.forget]
description = "Decay sweep over a bounded scope: find notes that are redundant, stale, contradicted, or low-signal and propose what to forget, prune, or clean up."
examples = [
    "forget",
    "scan for decay",
    "what should I forget",
    "clean up notes",
    "prune",
    "scan my wip",
]
mode = "decay-scan"
procedure = "protocols/intent-forget.md"
context_budget_tokens = 2048
agents = ["forgetter"]
profile_reads = []
expected_subagent_count = 1
parallel = false

