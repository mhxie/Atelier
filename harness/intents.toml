# Sync digests the mobile-capture submodule $OV/zettelm/ into daily notes and
# raw attachments, enriches with backlinks, then stages zettelm deletions for
# the user to commit. Procedure: .claude/commands/sync.md.
[intents.sync]
description = "Ingest the mobile-capture submodule zettelm (fleeting notes from the phone) into the vault and stage its deletions; not the mailed digest report."
examples = [
    "sync",
    "digest zettelm",
    "digest mobile",
    "process zettelm",
    "sync mobile notes",
    "fleeting digest",
]
mode = "sync"
procedure = ".claude/commands/sync.md"
context_budget_bytes = 8192
agents = ["researcher", "curator", "challenger", "scribe", "reviewer"]
profile_reads = []
pattern = "orchestrator-subagent"
expected_subagent_count = 5
parallel = false

# Forget routes to a Forgetter decay sweep over a bounded scope. Default scope
# is $OV/wip/ unless the user names a path. Forgetter proposes; never deletes.
[intents.forget]
description = "Decay sweep over a bounded scope: find notes that are redundant, stale, contradicted, or low-signal and propose what to forget, prune, or clean up."
examples = [
    "forget",
    "scan for decay",
    "what should I forget",
    "clean up notes",
    "prune",
    "scan my wip",
]
mode = "decay-scan"
procedure = "protocols/intent-forget.md"
context_budget_bytes = 8192
agents = ["forgetter"]
profile_reads = []
pattern = "generator-verifier"
expected_subagent_count = 1
parallel = false

