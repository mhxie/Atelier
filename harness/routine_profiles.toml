version = 1

# Public, routine-agnostic capability profiles. Private routine names and
# output paths stay in $OV/_meta/routine_watch.toml and reference these rows.
#
# Unattended local model routines always use the fixed Codex adapter. Runtime
# selection and fallback belong only to interactive launches.
# Private rss_sources requires web:live; bounded pre-model collection is owned
# by routine_adapter.py, without broadening the model's shell network access.

[profiles.local-maintenance]
surface = "local"
sandbox = "workspace-write"
atelier_access = "read"
web_search = "disabled"
shell_network = "disabled"
user_config = "ignore"
timeout_seconds = 7200
reasoning_effort = "high"
permissions = [
  "atelier:read",
  "vault:read",
  "staging:write",
  "shell:local",
]
required_clis = ["git", "node"]
required_plugins = []
optional_plugins = []
allowed_commands = ["/autoevo-nightly"]

[profiles.local-research]
surface = "local"
sandbox = "workspace-write"
atelier_access = "read"
web_search = "live"
shell_network = "disabled"
user_config = "ignore"
timeout_seconds = 1800
reasoning_effort = "medium"
permissions = [
  "atelier:read",
  "vault:read-write",
  "web:live",
]
required_clis = []
required_plugins = []
optional_plugins = []
allowed_commands = ["/run-routine"]

[profiles.local-synthesis]
surface = "local"
sandbox = "workspace-write"
atelier_access = "read"
