version = 1

# Public, routine-agnostic capability profiles. Private routine names and
# output paths stay in $OV/_meta/routine_watch.toml and reference these rows.

[profiles.local-maintenance]
surface = "local"
sandbox = "danger-full-access"
atelier_access = "read-write"
web_search = "disabled"
shell_network = "unrestricted"
user_config = "ignore"
timeout_seconds = 7200
reasoning_effort = "high"
permissions = [
  "atelier:read-write",
  "vault:read-write",
  "vault:git-commit",
  "shell:local",
]
required_clis = ["git", "uv"]
required_plugins = []
optional_plugins = []
allowed_commands = ["/autoevo-nightly"]

