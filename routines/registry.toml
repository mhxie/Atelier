version = 1

# Public routine adapters. Private routine rows select one without becoming
# public or entering skill discovery.
[adapters.archived-prompt]
procedure = "routines/_adapters/archived-prompt/PROCEDURE.md"

[adapters.autoevo]
procedure = "routines/_adapters/autoevo/PROCEDURE.md"

[[routine]]
name = "semantic-index"
runner = "process"
cron = ["30 7 * * *", "30 19 * * *"]
timezone = "local"
argv = ["uv", "run", "--offline", "--frozen", "scripts/semantic.py", "index"]
timeout_seconds = 7200
retry_safe = true
retries = 1
retry_delay_seconds = 300

[[routine]]
name = "tracking-refresh"
runner = "process"
cron = ["30 5 * * *", "30 17 * * *"]
timezone = "local"
argv = ["{python}", "scripts/refresh_tracking.py", "--json"]
timeout_seconds = 60
retry_safe = true
retries = 1
retry_delay_seconds = 60

[[routine]]
name = "daily-digest"
runner = "process"
cron = ["20 6 * * *"]
timezone = "local"
argv = ["{python}", "scripts/routine_digest.py", "morning", "--refresh-quota", "--no-weather"]
timeout_seconds = 600
retry_safe = true
retries = 1
retry_delay_seconds = 300
