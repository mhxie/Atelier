[project]
name = "atelier"
version = "0.1.0"
description = "Your AI-native personal operating system"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==4.0.0",
    "PyYAML==6.0.3",
    "tomli-w==1.2.0",
    "openai>=3.8.0",
    "prefect>=3.4,<4",
    "check-jsonschema==0.38.0",
]

[tool.ruff]
# Strict core only: correctness (F), syntax-adjacent pycodestyle errors, and
# the shebang/exec-bit class that produced a false review BLOCKER on
# 2026-08-23. Style families stay out until their existing findings are
# triaged; widen deliberately, never by default.
line-length = 120

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "EXE001"]
